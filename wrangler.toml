name = "deobfus"
main = "worker.js"
compatibility_date = "2026-11-01"

# Ini WAJIB ada. Memberitahu Wrangler untuk memperlakukan file ini 
# sebagai string teks mentah, BUKAN kode JavaScript/CSS yang dieksekusi.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/app.js"]
fallthrough = true

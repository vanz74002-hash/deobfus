name = "deobfus"
main = "worker.js"
compatibility_date = "2026-11-01"

# PENTING: Beritahu Wrangler untuk memperlakukan file ini sebagai teks biasa (string), 
# bukan modul JavaScript/CSS yang dieksekusi. Ini mencegah error "document is not defined".
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "app.js"]
fallthrough = true

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRO // Luau Deobfuscator</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-grid"></div>
    
    <main class="container">
        <header class="header">
            <h1 class="glitch" data-text="KAIRO_ENGINE">KAIRO_ENGINE</h1>
            <p class="subtitle">UNIVERSAL LUAU DEOBFUSCATION PROTOCOL</p>
            <div class="status-bar">
                <span class="status-dot online"></span> SYSTEM ONLINE // v4.1
            </div>
        </header>

        <section class="workspace">
            <div class="panel input-panel">
                <div class="panel-header">
                    <span class="indicator"></span> INPUT_PAYLOAD
                </div>
                <textarea id="codeInput" placeholder="-- Paste obfuscated Luau code here..."></textarea>
                <div class="file-upload">
                    <label for="fileInput" class="file-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        CHOOSE FILE (.txt, .lua)
                    </label>
                    <input type="file" id="fileInput" accept=".txt,.lua" hidden>
                    <span id="fileName" class="file-name">No file selected</span>
                </div>
            </div>

            <div class="controls">
                <button id="deobfBtn" class="btn-deobf">
                    <span class="btn-text">INITIATE DEOBFUSCATION</span>
                    <span class="btn-loader"></span>
                </button>
            </div>
        </section>

        <footer class="footer">
            <p>// BUILT BY KAIRO // CYBERCRIME GAME SPECIALIST //</p>
        </footer>
    </main>

    <script src="/app.js"></script>
</body>
</html>
